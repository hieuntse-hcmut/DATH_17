services:
  mysql:
    image: mysql:8.4
    container_name: smart-campus-mysql
    environment:
      MYSQL_DATABASE: smart_campus
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: smartcampus
      MYSQL_PASSWORD: smartcampus
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  
  backend:
    image: eclipse-temurin:21-jdk
    container_name: smart-campus-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_campus
      SPRING_DATASOURCE_USERNAME: smartcampus
      SPRING_DATASOURCE_PASSWORD: smartcampus
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded signing key}
    command: sh ./mvnw spring-boot:run

volumes:
  mysql_data:
  frontend_node_modules:
  maven_cache: